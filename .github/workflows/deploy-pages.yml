name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

      # The site is served from https://<user>.github.io/<repo>/, so assets and the router need that base path.
      - name: Build
        run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          # Optional: add a repository secret named VITE_GEOAPIFY_API_KEY to build a key into the site.
          # If it's not set, visitors are asked to paste their own free key. A built-in key is public:
          # restrict it to https://<user>.github.io in your Geoapify project settings.
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}

      # GitHub Pages has no SPA rewrites: serving index.html as 404.html makes /nearby work on refresh.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fails loudly if the live site is still the raw source, which happens when
  # Settings → Pages → Source is "Deploy from a branch" instead of "GitHub Actions".
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site serves the built app
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for i in 1 2 3 4 5 6; do
            sleep 30
            html=$(curl -fsSL "$url?check=$GITHUB_RUN_ID-$i" || true)
            if echo "$html" | grep -q '/src/main.tsx'; then
              echo "::error::$url is serving the unbuilt source. Set Settings → Pages → Source to 'GitHub Actions', then re-run this workflow."
              exit 1
            fi
            if echo "$html" | grep -q '/assets/index-'; then
              echo "Live site OK: $url"
              exit 0
            fi
          done
          echo "::warning::Couldn't confirm the live site yet (it may still be propagating)."
